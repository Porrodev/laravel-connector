name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11.*', '12.*', '13.*']
        include:
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
        exclude:
          - php: '8.2'
            laravel: '13.*'
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, pdo_sqlite
          coverage: none
      # Until the porro/* packages are on Packagist, resolve them from GitHub.
      - run: composer config repositories.php-core vcs https://github.com/Porrodev/php-core
      # Laravel 11 is past security support, so Composer blocks it by default.
      # The connector still supports it: those are the sites Porro flags.
      - if: matrix.laravel == '11.*'
        run: composer config audit.block-insecure false
      - run: composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pest
      - run: vendor/bin/pint --test
        if: matrix.php == '8.4' && matrix.laravel == '13.*'
